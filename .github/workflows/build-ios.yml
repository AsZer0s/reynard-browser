name: Build Reynard iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, chinese-localization-actions ]
    paths:
      - 'browser/**'
      - 'engine/**'
      - 'patches/**'
      - 'support/**'
      - 'tools/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    timeout-minutes: 720
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Initialize lightweight submodules
        run: |
          # Do not recursively clone Firefox during checkout; it is huge.
          # update-gecko.sh performs a depth-1 checkout of the required release tag.
          git submodule init engine/firefox support/idevice
          git submodule update --init --depth 1 support/idevice

      - name: Install dependencies
        run: |
          set -euxo pipefail
          brew update
          if ! command -v ldid >/dev/null 2>&1; then
            brew install ldid
          fi
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup target add aarch64-apple-ios
          python3 -m pip install --upgrade pip

      - name: Download Gecko and apply patches
        run: |
          ./tools/development/update-gecko.sh
          ./tools/development/apply-patches.sh

      - name: Build idevice support
        run: ./tools/development/build-idevice.sh

      - name: Build Gecko engine
        run: ./tools/development/build-gecko.sh

      - name: Archive app
        run: ./tools/release/build-app.sh

      - name: Package IPA
        run: ./tools/release/create-ipa.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-iOS-build
          path: |
            dist/Reynard.ipa
            dist/Reynard-TrollStore.tipa
            dist/Reynard-Jailbroken.ipa
          if-no-files-found: error
